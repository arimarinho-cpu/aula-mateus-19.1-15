<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz &middot; O que Deus uniu &middot; Mateus 19.1&ndash;15</title>
<style>
  :root{
    --ink:#1c1c1c; --paper:#ffffff; --text:#232323; --muted:#7a7a7a;
    --yellow:#f4e75f; --gold:#b8933f; --line:#e4e4e4; --soft:#f6f6f6;
    --ok:#2e7d4f; --okbg:#eaf5ee; --no:#b23b3b; --nobg:#f9ecec;
    --serif:Georgia,"Cambria","Times New Roman",serif;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);font-family:var(--serif);
    -webkit-font-smoothing:antialiased;min-height:100vh;}
  .wrap{max-width:720px;margin:0 auto;padding:0 22px;}
  header{padding:52px 0 30px;text-align:center;}
  header .kicker{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--yellow);margin:0 0 18px;}
  header h1{font-family:var(--serif);font-weight:700;font-size:38px;line-height:1.1;color:var(--yellow);margin:0 0 10px;}
  header .sub{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:#cfcfcf;margin:0;}
  .card{background:var(--paper);border-radius:6px;padding:34px 30px 30px;margin:10px 0 40px;
    box-shadow:0 18px 40px rgba(0,0,0,.35);}
  .progress{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 26px;}
  .bar > i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}
  .axis{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--gold);margin:0 0 10px;}
  .q{font-size:22px;line-height:1.4;font-weight:700;margin:0 0 22px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{font-family:var(--serif);font-size:17px;line-height:1.4;text-align:left;cursor:pointer;
    background:var(--soft);border:1.5px solid var(--line);border-radius:5px;padding:14px 16px;
    color:var(--text);transition:border-color .12s,background .12s;display:flex;gap:12px;align-items:flex-start;}
  .opt:hover:not(.locked){border-color:#bdbdbd;}
  .opt .mark{font-family:var(--sans);font-weight:700;color:var(--muted);flex:0 0 auto;min-width:18px;}
  .opt.correct{background:var(--okbg);border-color:var(--ok);}
  .opt.correct .mark{color:var(--ok);}
  .opt.wrong{background:var(--nobg);border-color:var(--no);}
  .opt.wrong .mark{color:var(--no);}
  .opt.locked{cursor:default;}
  .opt.dim{opacity:.6;}
  .feedback{margin:22px 0 0;padding:16px 18px;border-radius:5px;font-size:16px;line-height:1.55;display:none;}
  .feedback.show{display:block;}
  .feedback.good{background:var(--okbg);border-left:4px solid var(--ok);}
  .feedback.bad{background:var(--nobg);border-left:4px solid var(--no);}
  .feedback .verdict{font-family:var(--sans);font-weight:700;letter-spacing:.02em;}
  .feedback.good .verdict{color:var(--ok);}
  .feedback.bad .verdict{color:var(--no);}
  .nav{display:flex;justify-content:flex-end;margin:24px 0 0;}
  button.next{font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink);background:var(--yellow);border:none;border-radius:4px;
    padding:13px 26px;cursor:pointer;transition:opacity .15s;}
  button.next:hover{opacity:.85;}
  button.next:disabled{opacity:.4;cursor:not-allowed;}
  .result{text-align:center;padding:12px 0 6px;}
  .result .score{font-family:var(--serif);font-weight:700;font-size:58px;color:var(--ink);margin:6px 0 2px;}
  .result .score small{font-size:26px;color:var(--muted);}
  .result .band{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--gold);margin:0 0 16px;}
  .result p.msg{font-size:18px;line-height:1.6;color:var(--text);margin:0 auto 26px;max-width:520px;}
  .result .anchor{font-style:italic;font-size:19px;color:#444;margin:0 auto 26px;max-width:520px;}
  .result button{font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink);background:var(--yellow);border:none;border-radius:4px;
    padding:13px 26px;cursor:pointer;margin:0 6px;}
  .result a.back{font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;text-decoration:none;color:var(--ink);background:#e9e9e9;border-radius:4px;
    padding:13px 26px;display:inline-block;margin:0 6px;}
  footer{color:#8c8c8c;font-family:var(--sans);font-size:12px;text-align:center;padding:6px 22px 44px;}
  @media (max-width:640px){
    header h1{font-size:30px;} .card{padding:26px 20px;} .q{font-size:19px;} .opt{font-size:16px;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <p class="kicker">Escola Bíblica &middot; Estudos Expositivos</p>
    <h1>Quiz da Aula</h1>
    <p class="sub">O que Deus uniu &middot; Mateus 19.1&ndash;15</p>
  </div>
</header>

<div class="wrap">
  <div class="card" id="card"></div>
</div>

<footer>Mateus 19.1&ndash;15 &middot; Arisvaldo Marinho Cunha</footer>

<script>
const QUESTIONS = [
  {
    axis: "I \u00b7 Contexto",
    q: "A f\u00f3rmula \u201cconcluindo Jesus estas palavras\u201d (Mt 19.1) cumpre qual fun\u00e7\u00e3o no Evangelho?",
    options: [
      "Encerra cada um dos cinco grandes discursos de Jesus; aqui, fecha o Discurso Comunit\u00e1rio (Mt 18).",
      "Marca o in\u00edcio do minist\u00e9rio galileu.",
      "Assinala o fim das par\u00e1bolas no Evangelho.",
      "\u00c9 exclusiva deste cap\u00edtulo, sem paralelo."
    ],
    correct: 0,
    explain: "A f\u00f3rmula reaparece em 7.28; 11.1; 13.53; 19.1 e 26.1. Em 19.1 ela encerra o Discurso Comunit\u00e1rio de Mateus 18 e abre a rota final rumo a Jerusal\u00e9m."
  },
  {
    axis: "I \u00b7 Contexto",
    q: "Por que a pergunta sobre div\u00f3rcio, feita al\u00e9m do Jord\u00e3o, funcionava como armadilha (peirazontes)?",
    options: [
      "Porque a lei romana proibia debates religiosos na Pereia.",
      "Porque for\u00e7ava Jesus a tomar partido na disputa Hillel x Shammai e, na travessia pela Pereia (prov\u00e1vel dom\u00ednio de Antipas), reacendia a quest\u00e3o que custara a vida a Jo\u00e3o Batista.",
      "Porque os fariseus queriam apenas uma instru\u00e7\u00e3o sincera sobre Deuteron\u00f4mio.",
      "Porque Jesus n\u00e3o conhecia o debate rab\u00ednico da \u00e9poca."
    ],
    correct: 1,
    explain: "O verbo peirazontes indica \u201cpor \u00e0 prova\u201d. A pergunta prendia Jesus na casu\u00edstica das escolas; e o percurso mais prov\u00e1vel, pela Pereia (dom\u00ednio de Antipas), reacendia a quest\u00e3o matrimonial que levara \u00e0 morte de Jo\u00e3o Batista (Mt 14.3-4). A express\u00e3o \u201calém do Jord\u00e3o\u201d, por\u00e9m, admite ler tamb\u00e9m o destino, a Judeia; a geografia exata n\u00e3o \u00e9 certa."
  },
  {
    axis: "II \u00b7 Debate rab\u00ednico",
    q: "A express\u00e3o \u201cpor qualquer motivo\u201d (kata pasan aitian) reproduzia a posi\u00e7\u00e3o de qual escola?",
    options: [
      "A escola de Shammai, restritiva.",
      "A escola ess\u00eania de Qumran.",
      "A escola de Hillel, liberal e popular.",
      "A escola de Gamaliel, intermedi\u00e1ria."
    ],
    correct: 2,
    explain: "Hillel admitia o div\u00f3rcio por quase qualquer capricho, at\u00e9 a comida queimada. Shammai o restringia \u00e0 falta grave. Jesus recusa escolher entre as duas e recua \u00e0 cria\u00e7\u00e3o."
  },
  {
    axis: "II \u00b7 Virada criacional",
    q: "Em que Jesus fundamenta a indissolubilidade do casamento, em vez de arbitrar Deuteron\u00f4mio 24?",
    options: [
      "Nos Dez Mandamentos (\u00caxodo 20).",
      "Na fus\u00e3o de G\u00eanesis 1.27 e 2.24, o padr\u00e3o criacional anterior e superior \u00e0 legisla\u00e7\u00e3o de exce\u00e7\u00e3o.",
      "Na lei do levirato (Deuteron\u00f4mio 25).",
      "Na tradi\u00e7\u00e3o oral dos rabinos."
    ],
    correct: 1,
    explain: "Jesus funde G\u00eanesis 1.27 (homem e mulher) e 2.24 (uma s\u00f3 carne), estabelecendo a cria\u00e7\u00e3o como crit\u00e9rio normativo supremo."
  },
  {
    axis: "II \u00b7 Virada criacional",
    q: "O verbo grego traduzido por \u201cajuntou\u201d (synezeuxen) carrega qual imagem?",
    options: [
      "A de um contrato comercial assinado por testemunhas.",
      "A de jungir, colocar dois animais debaixo de um mesmo jugo para puxarem na mesma dire\u00e7\u00e3o; um ato vertical selado por Deus.",
      "A de uma alian\u00e7a pol\u00edtica entre duas fam\u00edlias.",
      "A de um la\u00e7o afetivo espont\u00e2neo e revog\u00e1vel."
    ],
    correct: 1,
    explain: "Synezeuxen deriva da ideia do jugo (zygos). A voz passiva indica que \u00e9 Deus quem une; por isso o ser humano n\u00e3o tem autoridade ontol\u00f3gica para separar."
  },
  {
    axis: "III \u00b7 Concess\u00e3o",
    q: "Qual corre\u00e7\u00e3o Jesus faz \u00e0 leitura que os fariseus fazem de Mois\u00e9s?",
    options: [
      "Corrige o verbo: Mois\u00e9s \u201cpermitiu\u201d (epetrepsen), n\u00e3o \u201cmandou\u201d (eneteilato) o div\u00f3rcio.",
      "Afirma que Mois\u00e9s jamais tratou do div\u00f3rcio.",
      "Declara Deuteron\u00f4mio 24 revogado por Malaquias.",
      "Diz que Mois\u00e9s instituiu o div\u00f3rcio como ideal."
    ],
    correct: 0,
    explain: "Deuteron\u00f4mio 24 n\u00e3o institui o div\u00f3rcio; regula, por causa da dureza do cora\u00e7\u00e3o (sklerokardia), uma pr\u00e1tica j\u00e1 existente. \u00c9 concess\u00e3o protetiva, um \u201cBand-Aid\u201d jur\u00eddico, n\u00e3o institui\u00e7\u00e3o."
  },
  {
    axis: "III \u00b7 Cl\u00e1usula de exce\u00e7\u00e3o",
    q: "Sobre a cl\u00e1usula de exce\u00e7\u00e3o (porneia), o que Mateus deixa claro?",
    options: [
      "Os quatro Evangelhos a registram de modo id\u00eantico.",
      "Somente Mateus a registra (5.32; 19.9); Marcos e Lucas n\u00e3o.",
      "Ela aparece apenas em Marcos.",
      "Jesus lista todas as causas leg\u00edtimas de div\u00f3rcio."
    ],
    correct: 1,
    explain: "A exce\u00e7\u00e3o \u00e9 registro exclusivo de Mateus. Stott lembra que a cl\u00e1usula \u00e9 \u201cum enigma muito conhecido\u201d, sobre o qual os comentaristas n\u00e3o s\u00e3o un\u00e2nimes."
  },
  {
    axis: "III \u00b7 Sistematiza\u00e7\u00e3o",
    q: "A proposta de Wayne Grudem, que amplia os fundamentos do div\u00f3rcio, ancora-se exegeticamente em qual texto?",
    options: [
      "Em Mateus 19.9, ampliando o sentido de porneia.",
      "Em 1 Cor\u00edntios 7.15, na express\u00e3o \u201cem tais casos\u201d (en tois toioutois); \u00e9 leitura contestada.",
      "No Serm\u00e3o do Monte (Mateus 5\u20137).",
      "Em Malaquias 2.16."
    ],
    correct: 1,
    explain: "Grudem prop\u00f5e ler en tois toioutois como categoria mais ampla. \u00c9 posi\u00e7\u00e3o contestada: cr\u00edticos sustentam que o antecedente remete ao abandono. H\u00e1 acordo, por\u00e9m, de que a igreja deve proteger o c\u00f4njuge agredido."
  },
  {
    axis: "IV \u00b7 Celibato",
    q: "O que Jesus quer dizer com \u201cos que a si mesmos se fizeram eunucos, por causa do reino\u201d (Mt 19.12)?",
    options: [
      "Uma mutila\u00e7\u00e3o f\u00edsica exigida dos disc\u00edpulos.",
      "Uma met\u00e1fora para a ren\u00fancia volunt\u00e1ria ao casamento, dom (charisma) concedido, n\u00e3o vocação superior.",
      "Uma condena\u00e7\u00e3o do casamento como estado inferior.",
      "Uma refer\u00eancia aos eunucos das cortes orientais."
    ],
    correct: 1,
    explain: "A linguagem \u00e9 figurada. Casamento e solteirice s\u00e3o dons distribu\u00eddos soberanamente, n\u00e3o conquistas do orgulho asc\u00e9tico. Aquilo que a Lei via como mutila\u00e7\u00e3o (Dt 23.1), Jesus transfigura em consagra\u00e7\u00e3o livre."
  },
  {
    axis: "V \u00b7 As crian\u00e7as",
    q: "Segundo Turner, qual \u00e9 o duplo movimento das crian\u00e7as entre Mateus 18 e Mateus 19?",
    options: [
      "De inoc\u00eancia natural (Mt 18) a pecado original (Mt 19).",
      "De padr\u00e3o de convers\u00e3o (Mt 18) a modelo de posse do Reino (Mt 19).",
      "De disc\u00edpulos (Mt 18) a mestres (Mt 19).",
      "De exemplo negativo (Mt 18) a positivo (Mt 19)."
    ],
    correct: 1,
    explain: "Em Mateus 18 a crian\u00e7a \u00e9 o padr\u00e3o de convers\u00e3o (o caminho para entrar); em Mateus 19, o modelo de posse (dos tais \u00e9 o Reino). O ponto \u00e9 a depend\u00eancia total, m\u00e3os vazias, n\u00e3o a inoc\u00eancia sentimental."
  }
];

const LETTERS = ["A","B","C","D","E"];
let idx = 0, score = 0, answered = false;
const card = document.getElementById("card");

function render(){
  answered = false;
  const item = QUESTIONS[idx];
  const pct = Math.round((idx) / QUESTIONS.length * 100);
  let html = "";
  html += '<div class="progress"><span>Quest\u00e3o ' + (idx+1) + ' de ' + QUESTIONS.length + '</span><span>' + score + ' acerto' + (score===1?'':'s') + '</span></div>';
  html += '<div class="bar"><i style="width:' + pct + '%"></i></div>';
  html += '<p class="axis">' + item.axis + '</p>';
  html += '<p class="q">' + item.q + '</p>';
  html += '<div class="opts" id="opts">';
  item.options.forEach(function(opt, i){
    html += '<div class="opt" data-i="' + i + '"><span class="mark">' + LETTERS[i] + '</span><span>' + opt + '</span></div>';
  });
  html += '</div>';
  html += '<div class="feedback" id="fb"><span class="verdict" id="verdict"></span> <span id="explain"></span></div>';
  html += '<div class="nav"><button class="next" id="next" disabled>' + (idx === QUESTIONS.length-1 ? 'Ver resultado' : 'Pr\u00f3xima') + '</button></div>';
  card.innerHTML = html;
  card.querySelectorAll(".opt").forEach(function(o){ o.addEventListener("click", function(){ choose(parseInt(o.dataset.i)); }); });
  document.getElementById("next").addEventListener("click", nextQ);
}

function choose(i){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[idx];
  card.querySelectorAll(".opt").forEach(function(o){
    const oi = parseInt(o.dataset.i);
    o.classList.add("locked");
    if(oi === item.correct) o.classList.add("correct");
    else if(oi === i) o.classList.add("wrong");
    else o.classList.add("dim");
  });
  const fb = document.getElementById("fb");
  if(i === item.correct){ score++; fb.classList.add("show","good"); document.getElementById("verdict").textContent = "Correto."; }
  else { fb.classList.add("show","bad"); document.getElementById("verdict").textContent = "N\u00e3o \u00e9 essa."; }
  document.getElementById("explain").textContent = " " + item.explain;
  document.getElementById("next").disabled = false;
}

function nextQ(){
  if(idx < QUESTIONS.length - 1){ idx++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else results();
}

function results(){
  const total = QUESTIONS.length;
  const pct = Math.round(score/total*100);
  let band, msg;
  if(pct === 100){ band = "Dom\u00ednio pleno"; msg = "Voc\u00ea percorreu os cinco eixos com precis\u00e3o: contexto, virada criacional, concess\u00e3o, celibato e crian\u00e7as. A gram\u00e1tica dos regimes do Reino ficou clara."; }
  else if(pct >= 70){ band = "Muito bom"; msg = "Voc\u00ea domina o essencial da per\u00edcope. Revise os pontos que escaparam e a s\u00edntese ficar\u00e1 completa."; }
  else if(pct >= 40){ band = "Em progresso"; msg = "H\u00e1 uma boa base. Vale reler a aula, com aten\u00e7\u00e3o \u00e0 distin\u00e7\u00e3o entre concess\u00e3o e institui\u00e7\u00e3o e \u00e0 imagem do jugo."; }
  else { band = "Vale revisar"; msg = "Sugiro reler a aula com calma: cada eixo prepara o seguinte, e o conjunto revela uma s\u00f3 gram\u00e1tica do Reino."; }
  card.innerHTML =
    '<div class="result">' +
      '<p class="axis">Resultado</p>' +
      '<p class="score">' + score + '<small>/' + total + '</small></p>' +
      '<p class="band">' + band + ' \u00b7 ' + pct + '%</p>' +
      '<p class="msg">' + msg + '</p>' +
      '<p class="anchor">\u201cNo Reino, o verbo decisivo jamais \u00e9 conquistar; \u00e9 receber.\u201d</p>' +
      '<div><button id="again">Refazer o quiz</button><a class="back" href="index.html">Voltar \u00e0 aula</a></div>' +
    '</div>';
  document.getElementById("again").addEventListener("click", function(){ idx=0; score=0; render(); window.scrollTo({top:0,behavior:"smooth"}); });
}

render();
</script>
</body>
</html>
